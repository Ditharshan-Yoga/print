<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meerah Gallery - Address Label Printer</title>
<style>
:root{--w:148mm;--h:210mm;--s:1}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f1f1f1;color:#222}
.app{display:flex;gap:20px;padding:16px;flex-wrap:wrap;align-items:flex-start;justify-content:center}
.panel{background:#fff;padding:16px;border-radius:10px;width:320px;box-shadow:0 1px 4px #0002}
.panel h2{margin:0 0 12px;font-size:18px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
textarea,select,input[type=file]{width:100%;font:inherit;padding:8px;border:1px solid #bbb;border-radius:6px}
textarea{height:110px;resize:vertical}
small{color:#666}
button{margin-top:16px;width:100%;padding:12px;font-size:16px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer}
.preview-wrap{max-width:100%;overflow:hidden}
.label{--lx:29mm;--lw:24mm;--t:7mm;--a:5.4mm;--b:6.2mm;--q:30mm;--si:38mm;--st:6mm;--fs:1;
 position:relative;width:var(--w);height:var(--h);background:#fff;font-family:"Times New Roman",serif;color:#000;
 box-shadow:0 1px 6px #0003;overflow:hidden;text-align:center;display:flex;flex-direction:column;padding:6mm 8mm 5mm}
.label .logo{flex:none;display:block;margin:0 auto;width:46%;max-height:36%;object-fit:contain}
.label .mid{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:2mm 0;overflow:hidden}
.label .blk{display:flex;align-items:flex-start;padding-left:var(--lx);text-align:left}
.label .t{flex:none;width:var(--lw);white-space:nowrap;font-size:calc(var(--t)*var(--fs));margin:0;line-height:1.2}
.label .blk .addr{flex:1;min-width:0;text-align:left}
.label .addr{font-size:calc(var(--a)*var(--fs));line-height:1.3;white-space:pre-line;overflow-wrap:anywhere}
.label .addr{font-weight:bold}
.label .to .addr{font-size:calc(var(--b)*var(--fs));font-weight:bold}
.label .foot{flex:none;display:flex;justify-content:space-between;align-items:flex-end;gap:3mm}
.label .qrbox{width:var(--q);height:var(--q);flex:none}
.label .qr{width:100%;height:100%;object-fit:contain;display:block}
.label .soc{text-align:center;width:calc(var(--si)*1.45)}
.label .soc img{width:var(--si);display:block;margin:0 auto 1mm}
.label .soc div{font-size:var(--st);line-height:1.35}
.label.mm80{--lx:15mm;--lw:13mm;--w:80mm;--h:113mm;--t:4.5mm;--a:3.4mm;--b:3.8mm;--q:20mm;--si:26mm;--st:3.6mm;padding:4mm 5mm 3mm}
@page{size:148mm 210mm;margin:0}
@media print{
 body{background:#fff}.panel{display:none}.app{padding:0;display:block}
 .preview-wrap{overflow:visible}.label{box-shadow:none;page-break-after:avoid}
}
</style></head><body>
<div class="app">
 <div class="panel">
  <h2>Address Label</h2>
  <label for="from">From address <small>(one line per row)</small></label>
  <textarea id="from" placeholder="Name&#10;Street&#10;City&#10;Phone"></textarea>
  <label for="to">To address <small>(one line per row)</small></label>
  <textarea id="to" placeholder="Name&#10;Street&#10;City&#10;Phone"></textarea>
  <label for="qr">QR code image</label>
  <input type="file" id="qr" accept="image/*">
  <label for="size">Paper size</label>
  <select id="size">
   <option value="a5">A5 portrait (148 x 210 mm)</option>
   <option value="80">80mm thermal roll (80 x 113 mm)</option>
  </select>
  <button id="print">Print</button>
  <button id="share" style="background:#fff;color:#111;border:2px solid #111;margin-top:10px">Share / Save as image</button>
  <small style="display:block;margin-top:8px">On iPhone/Android: use <b>Share / Save</b> to send the label to your printer app (e.g. AirPrint, RawBT).</small>
 </div>

<script>
const $=id=>document.getElementById(id);
function esc(s){return s.split("\n").map(l=>l.trim()).filter(Boolean).join("\n")}
function fit(){
 const L=$("label"),m=L.querySelector(".mid");let fs=1;
 L.style.setProperty("--fs",fs);
 while((m.scrollHeight>m.clientHeight+1)&&fs>0.35){fs-=0.03;L.style.setProperty("--fs",fs.toFixed(2))}
}
$("from").addEventListener("input",e=>{$("pFrom").textContent=esc(e.target.value);fit()});
$("to").addEventListener("input",e=>{$("pTo").textContent=esc(e.target.value);fit()});
$("qr").addEventListener("change",e=>{
 const f=e.target.files[0]; if(!f) return;
 const r=new FileReader();
 r.onload=()=>{$("pQr").src=r.result;$("pQr").style.display="block"};
 r.readAsDataURL(f);
});
let pageStyle=null;
function applySize(){
 const is80=$("size").value==="80";
 $("label").classList.toggle("mm80",is80);
 if(pageStyle) pageStyle.remove();
 pageStyle=document.createElement("style");
 pageStyle.textContent="@page{size:"+(is80?"80mm 113mm":"148mm 210mm")+";margin:0}";
 document.head.appendChild(pageStyle);
 fit();
}
$("size").addEventListener("change",()=>{applySize();zoomFit()});

const PR={a5:{W:148,H:210,pad:[6,8,5,8],lx:29,lw:24,t:7,a:5.4,b:6.2,q:30,si:38,st:6,dpi:300},
 m80:{W:80,H:113,pad:[4,5,3,5],lx:15,lw:13,t:4.5,a:3.4,b:3.8,q:20,si:26,st:3.6,dpi:203}};
function render(){
 const p=$("size").value==="80"?PR.m80:PR.a5,k=p.dpi/25.4,c=document.createElement("canvas");
 c.width=Math.round(p.W*k);c.height=Math.round(p.H*k);
 const x=c.getContext("2d"),F="'Times New Roman',Times,serif";
 x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle="#000";x.textBaseline="top";
 const [pt,pr,pb,pl]=p.pad,cw=p.W-pl-pr;
 const lg=document.querySelector(".label .logo");
 let lw=.46*cw,lh=lw*lg.naturalHeight/lg.naturalWidth;const mh=.36*(p.H-pt-pb);
 if(lh>mh){lh=mh;lw=lh*lg.naturalWidth/lg.naturalHeight}
 x.drawImage(lg,(p.W-lw)/2*k,pt*k,lw*k,lh*k);
 const ic=document.querySelector(".label .soc img"),icH=p.si*ic.naturalHeight/ic.naturalWidth,ls=p.st*1.35,socH=icH+1+2*ls;
 const fh=Math.max(p.q,socH),cx=p.W-pr-p.si*1.45/2,sTop=p.H-pb-socH;
 x.drawImage(ic,(cx-p.si/2)*k,sTop*k,p.si*k,icH*k);
 x.textAlign="center";x.font=p.st*k+"px "+F;
 x.fillText("@meerahgallery",cx*k,(sTop+icH+1)*k);x.fillText("+94 75 092 53 60",cx*k,(sTop+icH+1+ls)*k);
 const q=$("pQr");
 if(q.style.display!=="none"&&q.naturalWidth){const r=Math.min(p.q/q.naturalWidth,p.q/q.naturalHeight),w=q.naturalWidth*r,hh=q.naturalHeight*r;
  x.drawImage(q,(pl+(p.q-w)/2)*k,(p.H-pb-p.q+(p.q-hh)/2)*k,w*k,hh*k)}
 const top=pt+lh+2,mid=(p.H-pb-fh)-top-4,maxW=(cw-p.lx-p.lw)*k;
 const texts=[["From :",$("pFrom").textContent,p.a],["To:",$("pTo").textContent,p.b]];
 function wrap(s,px){x.font="bold "+px+"px "+F;const out=[];
  s.split("\n").forEach(l=>{let cur="";l.split(" ").forEach(w=>{const t=cur?cur+" "+w:w;
   if(x.measureText(t).width>maxW&&cur){out.push(cur);cur=w}else cur=t});out.push(cur)});return out}
 let fs=1,L;
 for(;;){L=texts.map(t=>{const a=t[2]*fs;const ln=wrap(t[1],a*k);return{ln,a,h:Math.max(p.t*fs*1.2,ln.length*a*1.3)}});
  if(L[0].h+L[1].h<=mid||fs<=.35)break;fs-=.03}
 const gap=(mid-L[0].h-L[1].h)/3;let y=top+2+gap;
 L.forEach((b,i)=>{x.textAlign="left";x.font=p.t*fs*k+"px "+F;x.fillText(texts[i][0],(pl+p.lx)*k,y*k);
  x.font="bold "+b.a*k+"px "+F;b.ln.forEach((s,j)=>x.fillText(s,(pl+p.lx+p.lw)*k,(y+j*b.a*1.3)*k));y+=b.h+gap});
 return c}
function getBlob(cb){render().toBlob(cb,"image/png")}
$("print").addEventListener("click",()=>{
 const is80=$("size").value==="80";
 getBlob(b=>{const u=URL.createObjectURL(b);
  const f=document.createElement("iframe");f.style.cssText="position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0";
  f.srcdoc='<!DOCTYPE html><style>@page{size:'+(is80?'80mm 113mm':'148mm 210mm')+';margin:0}html,body{margin:0;padding:0}img{display:block;width:'+(is80?'80mm;height:113mm':'148mm;height:210mm')+'}</style><img src="'+u+'">';
  f.onload=()=>{const im=f.contentDocument.querySelector("img");
   const go=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){window.open(u,"_blank")}};
   im.complete?go():im.onload=go};
  document.body.appendChild(f);setTimeout(()=>f.remove(),120000)})});
